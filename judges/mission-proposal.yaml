# Asked of Jev when the agent proposes a trip to the traveller's Person Server.
name: mission-proposal
type: mission
description: Is the proposed trip the one the traveller asked for?
attributes: [description]
questions:
  requested:
    instructions: >
      Is the proposed trip the one the traveller asked for: the same destination and
      dates, suggesting a budget no higher than any they named? The dates are the
      trip's span, so a proposal that lists only some of its flights is still the
      same trip. Quoted fares that come to more than that budget are fine: the
      manager decides those.
    criteria:
      "true": The trip they described, suggesting no more than any budget they named, even when its quotes come to more.
      "false": Another place or dates, or a suggested budget higher than they named.
